stages:
  - verify

fixture-verification:
  stage: verify
  image: node:24-bookworm
  tags:
    - docker
    - chrome
  script:
    - npm ci
    - node --version
    - npm run typecheck
    - npm run build
    - npm run test:unit
    - npm run test:integration
    - npm run test:e2e
    - npm run test:failure
  # Runner supplies Docker access for disposable PostgreSQL and /usr/bin/google-chrome.
  # No live target configuration is exposed to CI; test:live is intentionally absent.
