stages:
  - verify

fixture-validation:
  stage: verify
  # MRs are gated by exact-head local validation (docs/implementation/validation.md); the shared runner verifies main after each merge.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  interruptible: true
  image: node:24-bookworm-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: auditor_test
    POSTGRES_USER: auditor
    POSTGRES_PASSWORD: fixture-only
    TEST_DATABASE_URL: postgresql://auditor:fixture-only@postgres:5432/auditor_test
    CHROME_BIN: /usr/bin/chromium
    TARGET_ALLOWED_HOSTS: 127.0.0.1,localhost
    OLLAMA_URL: ""
    OLLAMA_MODEL: ""
    OPENROUTER_API_KEY: ""
    OPENROUTER_BASE_URL: ""
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends chromium ca-certificates
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
    - npm run build
    - env -u OPENROUTER_API_KEY -u OPENROUTER_BASE_URL npm run test:fixtures
