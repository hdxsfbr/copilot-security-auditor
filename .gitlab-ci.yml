stages:
  - verify

fixture-validation:
  stage: verify
  # MRs are gated by exact-head local validation (docs/implementation/validation.md); the shared runner verifies main after each merge.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  interruptible: true
  image: node:24-bookworm-slim
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: auditor_test
    POSTGRES_USER: auditor
    POSTGRES_PASSWORD: fixture-only
    TEST_DATABASE_URL: postgresql://auditor:fixture-only@postgres:5432/auditor_test
    CHROME_BIN: /usr/bin/chromium
    TARGET_ALLOWED_HOSTS: 127.0.0.1,localhost
    OLLAMA_URL: ""
    OLLAMA_MODEL: ""
    OPENROUTER_API_KEY: ""
    OPENROUTER_BASE_URL: ""
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends chromium ca-certificates
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run typecheck
    - npm run build
    - env -u OPENROUTER_API_KEY -u OPENROUTER_BASE_URL npm run test:fixtures
    # Regression SLO (HDX-32 / P01): 100 sequential fixture cases plus a 25-replay regression suite, judged against the limits in
    # tests/performance/slo-definition.ts. Runs after the fixture tests so it does not compete with them for the runner's one vCPU.
    # A fixture measurement on local stand-ins, not a live performance claim. Deterministic limits (SQL statements, event rows and bytes
    # per case) fail at once; generous timed limits are re-measured once before failing. Rationale: tests/performance/slo-definition.ts.
    - env -u OPENROUTER_API_KEY -u OPENROUTER_BASE_URL npm run perf:slo -- --out perf-slo-result.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - perf-slo-result.json
